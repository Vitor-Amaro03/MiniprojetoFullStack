<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="calculadora">
        <h1>Calculadora de IMC (Índice de Massa Corporal)</h1>
            <label for="peso">Peso (kg):</label>
            <input type="number" step="0.01" min="0.01" id="peso">

            <label for="altura">Altura (m):</label>
            <input type="number" step="0.01" min="0.01" id="altura">

            <button type="button" id="btnCalcular">Calcular IMC</button>
            <p id="textoResultado"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
